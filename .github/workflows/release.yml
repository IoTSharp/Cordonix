name: Cordonix tagged release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: cordonix-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - id: release
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Release tags must use v<major>.<minor>.<patch>: $TAG" >&2; exit 2 ;;
          esac
          version=$(printf '%s' "$TAG" | sed 's/^v//')
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tag is not a stable semantic version: $TAG" >&2
            exit 2
          fi
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      CDX_VERSION: ${{ needs.version.outputs.version }}
      SOURCE_DATE_EPOCH: '0'
      CDX_REQUIRE_CLEAN_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run Windows C11 gate
        shell: cmd
        run: eng\test.cmd
      - name: Verify Windows package
        shell: pwsh
        run: ./eng/test-package.ps1 -Version $env:CDX_VERSION
      - name: Validate official SPDX 2.3 schema
        shell: pwsh
        run: ./eng/test-spdx.ps1 -Path "build/packaging/cordonix-$env:CDX_VERSION-win-x64.spdx.json"
      - name: Verify compiler reproducibility in this environment
        shell: pwsh
        run: ./eng/test-build-reproducibility.ps1
      - name: Verify Windows installation and updates
        shell: pwsh
        run: ./eng/test-install-windows.ps1
      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: cordonix-windows-x64
          if-no-files-found: error
          path: |
            build/packaging/cordonix-${{ needs.version.outputs.version }}-win-x64.zip
            build/packaging/cordonix-${{ needs.version.outputs.version }}-win-x64.zip.sha256
            build/packaging/cordonix-${{ needs.version.outputs.version }}-win-x64.manifest.json
            build/packaging/cordonix-${{ needs.version.outputs.version }}-win-x64.provenance.json
            build/packaging/cordonix-${{ needs.version.outputs.version }}-win-x64.spdx.json

  linux:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CDX_VERSION: ${{ needs.version.outputs.version }}
      SOURCE_DATE_EPOCH: '0'
      CDX_REQUIRE_CLEAN_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run Linux C11 gate
        shell: bash
        run: timeout --kill-after=10s 300s sh eng/test-linux.sh
      - name: Require the real Linux ripgrep adapter
        run: timeout --kill-after=5s 85s sh eng/test-adapters-linux.sh
      - name: Build Linux release package
        shell: bash
        run: sh eng/test-package-linux.sh "$CDX_VERSION"
      - name: Validate official SPDX 2.3 schema
        shell: pwsh
        run: ./eng/test-spdx.ps1 -Path "build/packaging/cordonix-$env:CDX_VERSION-linux-x64.sbom.spdx.json"
      - name: Verify compiler reproducibility in this environment
        shell: pwsh
        run: ./eng/test-build-reproducibility.ps1
      - name: Verify Linux installation and updates
        shell: bash
        run: sh eng/test-install-linux.sh
      - name: Verify Linux package readback
        shell: bash
        run: |
          set -eu
          package_dir="build/packaging"
          archive="cordonix-$CDX_VERSION-linux-x64.tar.gz"
          (
            cd "$package_dir"
            sha256sum --check "$archive.sha256"
            timeout --kill-after=5s 30s tar -tzf "$archive" > /dev/null
          )
      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: cordonix-linux-x64
          if-no-files-found: error
          path: |
            build/packaging/cordonix-${{ needs.version.outputs.version }}-linux-x64.tar.gz
            build/packaging/cordonix-${{ needs.version.outputs.version }}-linux-x64.tar.gz.sha256
            build/packaging/cordonix-${{ needs.version.outputs.version }}-linux-x64.manifest.json
            build/packaging/cordonix-${{ needs.version.outputs.version }}-linux-x64.provenance.json
            build/packaging/cordonix-${{ needs.version.outputs.version }}-linux-x64.sbom.spdx.json

  github-release:
    needs: [version, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cordonix-windows-x64
          path: release-assets/windows
      - uses: actions/download-artifact@v4
        with:
          name: cordonix-linux-x64
          path: release-assets/linux
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -eu
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'This tag already has a GitHub Release. Preserve its published assets; use a new version for rebuilt packages.' >&2
            exit 1
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$TAG" \
              --generate-notes \
              release-assets/windows/* release-assets/linux/*
          fi

  gitee-source:
    needs: [version, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror main and the release tag to Gitee
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -eu
          if [ -z "$GITEE_TOKEN" ]; then
            echo 'Configure the GITEE_TOKEN repository secret before enabling dual publication.' >&2
            exit 2
          fi
          timeout --kill-after=10s 300s sh eng/mirror-gitee.sh "$TAG"

  gitee-release:
    needs: [version, github-release, gitee-source]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: cordonix-windows-x64
          path: release-assets/windows
      - uses: actions/download-artifact@v4
        with:
          name: cordonix-linux-x64
          path: release-assets/linux
      - name: Publish Gitee release and assets
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          TARGET_COMMIT: ${{ github.sha }}
        run: |
          set -eu
          if [ -z "$GITEE_TOKEN" ]; then
            echo 'Configure the GITEE_TOKEN repository secret before enabling dual publication.' >&2
            exit 2
          fi
          timeout --kill-after=10s 180s sh eng/publish-gitee-release.sh \
            IoTSharp Cordonix "$TAG" "$TARGET_COMMIT" "$GITHUB_WORKSPACE/release-assets"
