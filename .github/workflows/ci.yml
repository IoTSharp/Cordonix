name: Native C11 checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      CDX_VERSION: '0.0.1'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned external ripgrep
        shell: pwsh
        run: ./eng/prepare-ripgrep.ps1 -Destination "$env:RUNNER_TEMP/cordonix-ripgrep-15.2.0"
      - name: Compile C11 and exercise native processes, encodings and MCP
        shell: cmd
        run: eng\test.cmd
      - name: Compare real batch reads and HTTP representations
        shell: pwsh
        run: python tests/acceptance/three_stage_baseline.py --executable build/bin/cdx.exe --output build/three-stage-ci-windows.json
      - name: Verify tool profiles, execution projections and context measurements
        shell: pwsh
        run: |
          python tests/acceptance/context_efficiency_tests.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/protocol/tool_profile_stdio.py --executable build/bin/cdx.exe --output build/context-profile-ci-windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/protocol/execution_projection.py --executable build/bin/cdx.exe --output build/context-projection-ci-windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/acceptance/context_efficiency_baseline.py --executable build/bin/cdx.exe --output build/context-efficiency-ci-windows.json --deadline-seconds 120
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify discovery regression with a real executable
        run: python tests/acceptance/discovery_regressions.py --executable build/bin/cdx.exe --output build/discovery-regressions.json
      - name: Verify VNC pixels, authentication and current-user credentials
        run: python tests/acceptance/vnc_screenshot.py --executable build/bin/cdx.exe --output build/vnc-tests.json
      - name: Verify the portable package and its provenance
        shell: pwsh
        run: ./eng/test-package.ps1 -Version $env:CDX_VERSION
      - name: Validate official SPDX 2.3 schema
        shell: pwsh
        run: ./eng/test-spdx.ps1 -Path build/packaging/cordonix-0.0.1-win-x64.spdx.json
      - name: Verify compiler reproducibility in this environment
        shell: pwsh
        run: ./eng/test-build-reproducibility.ps1
      - name: Verify installation, mirror fallback and update rollback
        shell: pwsh
        run: ./eng/test-install-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: cordonix-windows-x64
          path: build/packaging/cordonix-0.0.1-win-x64.*
          if-no-files-found: error
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CDX_VERSION: '0.0.1'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned external ripgrep
        shell: pwsh
        run: ./eng/prepare-ripgrep.ps1 -Destination "$env:RUNNER_TEMP/cordonix-ripgrep-15.2.0"
      - name: Compile C11 and exercise POSIX processes, encodings and MCP
        run: timeout --kill-after=5s 300s sh eng/test-linux.sh
      - name: Compare real batch reads and POSIX path traversal
        run: timeout --kill-after=5s 250s python3 tests/acceptance/three_stage_baseline.py --executable build/linux/bin/cdx --output build/three-stage-ci-linux.json
      - name: Verify tool profiles, execution projections and context measurements
        run: |
          timeout --kill-after=5s 15s python3 tests/acceptance/context_efficiency_tests.py
          timeout --kill-after=5s 65s python3 tests/protocol/tool_profile_stdio.py --executable build/linux/bin/cdx --output build/context-profile-ci-linux
          timeout --kill-after=5s 125s python3 tests/protocol/execution_projection.py --executable build/linux/bin/cdx --output build/context-projection-ci-linux
          timeout --kill-after=5s 125s python3 tests/acceptance/context_efficiency_baseline.py --executable build/linux/bin/cdx --output build/context-efficiency-ci-linux.json --deadline-seconds 120
      - name: Verify discovery and virtual environment launches
        run: timeout --kill-after=2s 60s python3 tests/acceptance/discovery_regressions.py --executable build/linux/bin/cdx --output build/discovery-regressions.json
      - name: Verify the VNC platform contract
        run: timeout --kill-after=2s 30s python3 tests/acceptance/vnc_screenshot.py --executable build/linux/bin/cdx --output build/vnc-tests-linux.json
      - name: Require the real Linux ripgrep adapter
        run: timeout --kill-after=5s 85s sh eng/test-adapters-linux.sh
      - name: Verify ext4 filenames and the documented metadata policy
        run: timeout --kill-after=10s 75s sh eng/test-filesystem-linux.sh "$PWD/build/linux/bin/cdx" --receipt "$PWD/build/linux/filesystem.json"
      - name: Verify Linux package metadata and extracted executable
        run: sh eng/test-package-linux.sh
      - name: Validate official SPDX 2.3 schema
        shell: pwsh
        run: ./eng/test-spdx.ps1 -Path build/packaging/cordonix-0.0.1-linux-x64.sbom.spdx.json
      - name: Verify compiler reproducibility in this environment
        shell: pwsh
        run: ./eng/test-build-reproducibility.ps1
      - name: Verify installation, mirror fallback and update rollback
        run: sh eng/test-install-linux.sh
